<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #hud { 
            position: absolute; top: 15px; left: 15px; 
            color: #00ffff; font-size: 14px; font-weight: bold; 
            text-shadow: 0 0 8px #00ffff; pointer-events: none;
            background: rgba(0, 20, 40, 0.6); padding: 10px; border: 1px solid #00ffff;
            border-radius: 5px; text-transform: uppercase;
        }
        #hud.alert { color: #ff0033; text-shadow: 0 0 8px #ff0033; border-color: #ff0033; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">SYSTEM BOOT...</div>
    <script>
        const eveActive = REPLACE_ME_EVE_ACTIVE;
        const hud = document.getElementById('hud');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.04);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / 400, 0.1, 1000);
        camera.position.set(0, 3, 11); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, 400);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const gridHelper = new THREE.GridHelper(25, 25, 0x00ffff, 0x002244);
        gridHelper.position.y = -1.5;
        scene.add(gridHelper);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const mainLight = new THREE.SpotLight(0xffffff, 1.2);
        mainLight.position.set(0, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const flashLight = new THREE.PointLight(0xffffff, 0, 10);
        flashLight.position.set(0, 0, 0);
        scene.add(flashLight);

        function createLaptop(screenColor) {
            const laptopGroup = new THREE.Group();
            const silverMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
            
            const baseGeo = new THREE.BoxGeometry(1.8, 0.1, 1.2);
            const base = new THREE.Mesh(baseGeo, silverMat);
            base.position.y = 0.05;
            base.castShadow = true;
            laptopGroup.add(base);

            const kbGeo = new THREE.PlaneGeometry(1.5, 0.6);
            const kbMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const keyboard = new THREE.Mesh(kbGeo, kbMat);
            keyboard.rotation.x = -Math.PI / 2;
            keyboard.position.set(0, 0.101, 0.15);
            laptopGroup.add(keyboard);

            const tpGeo = new THREE.PlaneGeometry(0.5, 0.3);
            const tpMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const trackpad = new THREE.Mesh(tpGeo, tpMat);
            trackpad.rotation.x = -Math.PI / 2;
            trackpad.position.set(0, 0.102, 0.7);
            laptopGroup.add(trackpad);

            const screenGroup = new THREE.Group();
            screenGroup.position.set(0, 0.1, -0.6); 
            
            const lidGeo = new THREE.BoxGeometry(1.8, 1.2, 0.05);
            const lid = new THREE.Mesh(lidGeo, silverMat);
            lid.position.set(0, 0.6, 0);
            screenGroup.add(lid);

            const displayGeo = new THREE.PlaneGeometry(1.7, 1.05);
            const displayMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: screenColor, emissiveIntensity: 0.6 });
            const display = new THREE.Mesh(displayGeo, displayMat);
            display.position.set(0, 0.6, 0.026);
            screenGroup.add(display);

            screenGroup.rotation.x = -0.15;
            laptopGroup.add(screenGroup);
            return laptopGroup;
        }

        const alice = createLaptop(0x0066ff); 
        alice.position.set(-6, -0.5, 0);
        alice.rotation.y = Math.PI / 2; 
        scene.add(alice);

        const bob = createLaptop(0x00ff66); 
        bob.position.set(6, -0.5, 0);
        bob.rotation.y = -Math.PI / 2; 
        scene.add(bob);

        const sheathGeo = new THREE.CylinderGeometry(0.12, 0.12, 4, 32);
        const sheathMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const leftSheath = new THREE.Mesh(sheathGeo, sheathMat);
        leftSheath.rotation.z = Math.PI / 2;
        leftSheath.position.set(-4, -0.4, 0);
        scene.add(leftSheath);

        const rightSheath = new THREE.Mesh(sheathGeo, sheathMat);
        rightSheath.rotation.z = Math.PI / 2;
        rightSheath.position.set(4, -0.4, 0);
        scene.add(rightSheath);

        const coreGeo = new THREE.CylinderGeometry(0.04, 0.04, 12, 32);
        const coreMat = new THREE.MeshPhysicalMaterial({ color: 0x00ffff, transmission: 1.0, opacity: 0.8, transparent: true });
        const glassCore = new THREE.Mesh(coreGeo, coreMat);
        glassCore.rotation.z = Math.PI / 2;
        glassCore.position.set(0, -0.4, 0);
        scene.add(glassCore);

        const qubitGroup = new THREE.Group();
        const photonGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const photonMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 });
        const photon = new THREE.Mesh(photonGeo, photonMat);
        qubitGroup.add(photon);

        const ringGeo = new THREE.TorusGeometry(0.25, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa00ff, transparent: true, opacity: 0.8 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        const ring2 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 2;
        ring2.rotation.y = Math.PI / 2;
        qubitGroup.add(ring1);
        qubitGroup.add(ring2);

        qubitGroup.position.set(-5.5, -0.4, 0);
        scene.add(qubitGroup);

        const eveGeo = new THREE.OctahedronGeometry(0.4);
        const eveMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000, wireframe: true });
        const eve = new THREE.Mesh(eveGeo, eveMat);
        eve.position.set(0, 3, 0); 
        eve.visible = eveActive;
        scene.add(eve);

        let state = 'SECURE'; 
        let flashTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            ring1.rotation.y += 0.08;
            ring2.rotation.x += 0.08;
            eve.rotation.y += 0.05;

            if (eveActive && eve.position.y > -0.4) eve.position.y -= 0.06; 

            if (state === 'SECURE') {
                hud.innerText = "Status: Superposition / Entangled State\nIntegrity: 100%";
                hud.className = "";
                qubitGroup.position.x += 0.05;
                
                if (eveActive && qubitGroup.position.x >= 0) {
                    state = 'MEASURING';
                    flashTimer = 15;
                }
            } 
            else if (state === 'MEASURING') {
                hud.innerText = "⚠️ UNAUTHORIZED MEASUREMENT DETECTED ⚠️\nTRIGGERING WAVE COLLAPSE";
                hud.className = "alert";
                
                if (flashTimer > 0) {
                    flashLight.intensity = flashTimer * 0.5;
                    flashTimer--;
                } else {
                    ring1.visible = false;
                    ring2.visible = false;
                    photonMat.color.setHex(0x555555);
                    photonMat.emissiveIntensity = 0; 
                    state = 'COLLAPSED';
                }
            }
            else if (state === 'COLLAPSED') {
                hud.innerText = "Status: Quantum State Collapsed\nTransmitting Decoy (High QBER Expected)";
                qubitGroup.position.x += 0.04; 
                qubitGroup.position.y = -0.4 + (Math.sin(Date.now() * 0.05) * 0.1);
                photonMat.emissive.setHex(Math.random() > 0.5 ? 0xff0000 : 0x330000);
                photonMat.emissiveIntensity = Math.random() * 3;
            }

            if (qubitGroup.position.x > 5.5) {
                qubitGroup.position.set(-5.5, -0.4, 0);
                state = 'SECURE';
                ring1.visible = true;
                ring2.visible = true;
                photonMat.color.setHex(0x00ffff);
                photonMat.emissive.setHex(0x00ffff);
                photonMat.emissiveIntensity = 2;
                if (eveActive) eve.position.y = 3; 
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
